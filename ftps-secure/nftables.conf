flush ruleset;                           # on efface tout l’ancien ruleset

table inet filter {

    chain input {
        type filter hook input priority 0; policy drop;

        # --- trafic autorisé -------------------------------------------------
        iif lo accept;                                           # loopback
        ct state established,related accept;                     # connexions déjà établies

        # ► remplace "eth1" par l’interface privée réelle (souvent eth0 dans un conteneur)
        iifname "eth1" tcp dport { 21, 21100-21110 } accept;     # FTP actif + passif
        iifname "eth1" tcp dport 22 accept;                      # SSH interne (optionnel)
    }
}
