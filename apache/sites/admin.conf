<VirtualHost *:80>
    ServerName admin.rainbowbank.com
    Redirect permanent / https://admin.rainbowbank.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName admin.rainbowbank.com

    SSLEngine on
    SSLCertificateFile      /etc/ssl/certs/wildcard.crt
    SSLCertificateKeyFile   /etc/ssl/certs/wildcard.key

    DocumentRoot /var/www/html/admin.rainbowbank.com
    <Directory "/var/www/html/admin.rainbowbank.com">
        DirectoryIndex index.html
        Require all granted
        AllowOverride All
    </Directory>

    ErrorLog  "/var/log/apache2/error_admin.log"
    CustomLog "/var/log/apache2/access_admin.log" combined
</VirtualHost>
