<VirtualHost *:80>
    ServerName extranet.rainbowbank.com
    Redirect permanent / https://extranet.rainbowbank.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName extranet.rainbowbank.com

    SSLEngine on
    SSLCertificateFile      /usr/local/apache2/conf/certs/wildcard.crt
    SSLCertificateKeyFile   /usr/local/apache2/conf/certs/wildcard.key

    DocumentRoot /usr/local/apache2/htdocs/extranet.rainbowbank.com
    <Directory "/usr/local/apache2/htdocs/extranet.rainbowbank.com">
        Require all granted
        AllowOverride All
    </Directory>

    ErrorLog  "/proc/self/fd/2"
    CustomLog "/proc/self/fd/1" combined
</VirtualHost>
