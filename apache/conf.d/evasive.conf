<IfModule mod_evasive20.c>
    DOSHashTableSize    3097
    DOSPageCount        2
    DOSSiteCount        5
    DOSPageInterval     1
    DOSSiteInterval     1
    DOSBlockingPeriod   600
    DOSEmailNotify      admin@rainbowbank.com
    DOSLogDir           "/var/log/apache2/"
    DOSSystemCommand "/bin/echo %s >> /var/log/apache2/dos_evasive.log && /bin/date >> /var/log/apache2/dos_evasive.log"
</IfModule>


